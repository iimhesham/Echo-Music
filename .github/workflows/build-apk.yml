name: Build my APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "ndk;28.2.13676358" || true

      - name: Use my fixed debug signing key
        run: |
          mkdir -p ~/.android
          if [ -f .github/debug.keystore ]; then
            cp .github/debug.keystore ~/.android/debug.keystore
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalGmsDebug -PappVersionCode=$((200 + GITHUB_RUN_NUMBER)) --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Find and list APKs
        if: always()
        run: |
          echo "=== Looking for APKs ==="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || true
          ls -laR app/build/outputs/apk/ 2>/dev/null || true
          echo "=== Done ==="

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Music-debug-APK
          path: |
            app/build/outputs/apk/universalGms/debug/app-universal-gms-debug.apk
            build.log
          if-no-files-found: error

      - name: Inspect APK (package, version, signature)
        if: always()
        run: |
          APK=app/build/outputs/apk/universalGms/debug/app-universal-gms-debug.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          {
            ls -l "$APK"
            $BT/aapt2 dump badging "$APK" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion"
            $BT/apksigner verify --verbose --print-certs "$APK" | head -8
          } > /tmp/apk-info.txt 2>&1 || true
          cat /tmp/apk-info.txt

      - name: Publish APK as a GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sandia-${{ github.run_number }}"
          cp app/build/outputs/apk/universalGms/debug/app-universal-gms-debug.apk "Sandia-$TAG.apk"
          gh release create "$TAG" "Sandia-$TAG.apk" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Sandia build ${{ github.run_number }}" --notes "Debug build of commit ${{ github.sha }}"

      - name: Save build log summary to a branch
        if: always()
        run: |
          cp build.log /tmp/build.log || true
          grep -E "^e: |^w: .*error|FAILED|What went wrong|Execution failed" -A4 /tmp/build.log | head -150 > /tmp/errors.txt || true
          tail -n 120 /tmp/build.log > /tmp/tail.txt || true
          git config user.name "build-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan buildlog || true
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/errors.txt errors.txt 2>/dev/null || true
          cp /tmp/tail.txt tail.txt 2>/dev/null || true
          cp /tmp/apk-info.txt apk-info.txt 2>/dev/null || true
          git add errors.txt tail.txt apk-info.txt 2>/dev/null || true
          git commit -qm "build log" || true
          git push -f origin buildlog || true
