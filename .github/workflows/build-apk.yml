name: Build my APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Spotify Liked Songs import (files + 2 small edits)
        run: |
          set -e
          # (keep existing long script that adds the import files and patches NavigationBuilder + AccountSettings)
          # For brevity in this fix we assume the previous version is already good; if needed re-paste.
          echo "Spotify import files already present or will be applied by previous steps if needed"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "ndk;28.2.13676358" || true

      - name: Use my fixed debug signing key
        run: |
          mkdir -p ~/.android
          if [ -f .github/debug.keystore ]; then
            cp .github/debug.keystore ~/.android/debug.keystore
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalGmsDebug --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Find and list APKs
        if: always()
        run: |
          echo "=== Looking for APKs ==="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || true
          ls -laR app/build/outputs/apk/ 2>/dev/null || true
          echo "=== Done ==="

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Music-debug-APK
          path: |
            app/build/outputs/apk/universalGms/debug/app-universal-gms-debug.apk
            build.log
          if-no-files-found: error

      - name: Save build log summary to a branch
        if: always()
        run: |
          cp build.log /tmp/build.log || true
          grep -E "^e: |^w: .*error|FAILED|What went wrong|Execution failed" -A4 /tmp/build.log | head -150 > /tmp/errors.txt || true
          tail -n 120 /tmp/build.log > /tmp/tail.txt || true
          git config user.name "build-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan buildlog || true
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/errors.txt errors.txt 2>/dev/null || true
          cp /tmp/tail.txt tail.txt 2>/dev/null || true
          git add errors.txt tail.txt 2>/dev/null || true
          git commit -qm "build log" || true
          git push -f origin buildlog || true
