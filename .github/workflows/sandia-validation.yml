name: Sandia branch validation

on:
  push:
    branches:
      - sandia-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "ndk;28.2.13676358" || true

      - name: Use debug signing key
        run: |
          mkdir -p ~/.android
          if [ -f .github/debug.keystore ]; then
            cp .github/debug.keystore ~/.android/debug.keystore
          fi

      - name: Run unit tests and build Sandia APK
        run: |
          chmod +x gradlew
          ./gradlew test assembleUniversalGmsDebug -PappVersionCode=$((300 + GITHUB_RUN_NUMBER)) --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandia-validation-apk
          path: |
            app/build/outputs/apk/universalGms/debug/app-universal-gms-debug.apk
            build.log
          if-no-files-found: warn
