name: Sandia branch validation

on:
  push:
    branches:
      - sandia-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "ndk;28.2.13676358" || true

      - name: Use debug signing key
        run: |
          mkdir -p ~/.android
          if [ -f .github/debug.keystore ]; then
            cp .github/debug.keystore ~/.android/debug.keystore
          fi

      - name: Build Sandia APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalGmsDebug -PappVersionCode=$((300 + GITHUB_RUN_NUMBER)) --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandia-validation-apk
          path: |
            app/build/outputs/apk/universalGms/debug/app-universal-gms-debug.apk
            build.log
          if-no-files-found: warn
      - name: Publish APK for the in-app updater
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sandia-$((100 + GITHUB_RUN_NUMBER))"
          cp app/build/outputs/apk/universalGms/debug/app-universal-gms-debug.apk "Sandia-$TAG.apk"
          gh release create "$TAG" "Sandia-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sandía build $TAG" \
            --notes "Automatically built Sandía APK from commit $GITHUB_SHA."
